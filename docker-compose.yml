services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skycrash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro   # runs ONLY on the first start (empty volume)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skycrash"]
      interval: 5s
      timeout: 5s
      retries: 12
    # no "ports": the database is reachable only by the backend

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/skycrash
    # no "ports": only reachable through the web (Caddy) container

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
      - "${WEB_BIND:-127.0.0.1}:${WEB_TLS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

  # Cloudflare Tunnel: lets people reach your home PC without opening any router port.
  # Only started with:  docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
